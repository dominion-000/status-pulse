name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm prisma:generate
        env:
          # prisma.config.ts requires the variable; generating the client never connects to it
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          # Database tests run only when this repository secret is set; otherwise they are skipped
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

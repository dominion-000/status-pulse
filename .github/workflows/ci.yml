name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: status-pulse-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm prisma:generate
        env:
          DATABASE_URL: postgres://postgres:status-pulse-test@localhost:5432/postgres
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          DATABASE_URL_TEST: postgres://postgres:status-pulse-test@localhost:5432/postgres

openapi: 3.0.3
info:
  title: Status Pulse API
  version: 0.3.0
  description: >
    HTTP API of Status Pulse. Authenticated routes expect a bearer access token. The caller's role in a project is
    read from the memberships table on every request. A caller who is not a member of the project receives 404.
    A member whose role is too low receives 403. Roles are ordered Owner, Responder, Viewer. Errors use one envelope:
    an object with an `error` member holding `code`, `message` and, for validation failures, `details`.
servers:
  - url: /api/v1
    description: Versioned JSON API
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Auth
  - name: Projects
  - name: Services
  - name: Status
  - name: Incidents

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      description: The password is stored as a bcrypt hash with cost 12. Passwords longer than 72 bytes are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 1 }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      description: >
        A refresh token is valid once. An unknown, expired or already used token is refused with 401. Reuse of a
        used token also revokes the user's other sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1 }
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects:
    post:
      tags: [Projects]
      summary: Create a project
      description: The caller becomes its Owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                slug:
                  type: string
                  minLength: 2
                  maxLength: 64
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    get:
      tags: [Projects]
      summary: List the caller's projects
      responses:
        "200":
          description: Projects the caller belongs to, with the caller's role in each.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectWithRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: View a project
      description: Minimum role Viewer.
      responses:
        "200":
          description: The project and the caller's role.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/ProjectWithRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      summary: Invite an existing user
      description: Minimum role Owner. The invited user must already have an account. Only Responder and Viewer can be granted here; the Owner role is granted by changing a member's role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [Responder, Viewer] }
      responses:
        "201":
          description: The new member.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/MemberRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    get:
      tags: [Projects]
      summary: List members
      description: Minimum role Viewer.
      responses:
        "200":
          description: Members of the project.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Projects]
      summary: Change a member's role
      description: >
        Minimum role Owner. A change that would leave the project without an Owner is refused with 409. Giving
        a member the role they already have succeeds and changes nothing. A change is written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Owner, Responder, Viewer] }
      responses:
        "200":
          description: The member with the resulting role.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/MemberRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects/{projectId}/services:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Services]
      summary: Create a service
      description: >
        Minimum role Owner. The configuration is validated as a whole. Addresses that are private, loopback or
        link-local are refused. Creation writes configuration version 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
        "201":
          description: The created service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    get:
      tags: [Services]
      summary: List services
      description: Minimum role Viewer. Deleted services are not listed.
      responses:
        "200":
          description: Services of the project.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [Services]
      summary: View a service
      description: Minimum role Viewer.
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Services]
      summary: Edit a service
      description: >
        Minimum role Owner. Only the fields sent change. The merged result is validated as a complete configuration.
        `null` clears `expectedBodyText`, `degradedMs` and `credentials`. Unknown fields are rejected. A change that
        alters the configuration creates one new configuration version and an audit row; a request that changes
        nothing creates neither. The status is recalculated in the same transaction, so a change to a threshold, the latency
        limit or the interval can move the status and open an incident at once. Credentials are encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: The service and the names of the fields that changed.
          content:
            application/json:
              schema:
                type: object
                required: [service, changed]
                properties:
                  service: { $ref: "#/components/schemas/Service" }
                  changed:
                    type: array
                    description: Field names, with `credentials` when they were replaced or removed.
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects/{projectId}/services/{serviceId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [Services]
      summary: Configuration history
      description: Minimum role Owner. Snapshots never contain credentials; `hasCredentials` records whether any were set.
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, snapshot, actorUserId, createdAt]
                      properties:
                        version: { type: integer }
                        snapshot: { type: object, additionalProperties: true }
                        actorUserId:
                          { type: string, format: uuid, nullable: true }
                        createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}/disable:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      summary: Disable a service
      description: Minimum role Owner. A disabled service produces no checks and shows Unknown.
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}/enable:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      summary: Enable a service
      description: Minimum role Owner. Checks resume. An incident opens if the service is already known to be down.
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}/results:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [Status]
      summary: Recent check results
      description: Minimum role Viewer.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Results, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}/status:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [Status]
      summary: Current status
      description: Minimum role Viewer. `current` is the shown status; `computed` is derived from results and continues under an override.
      responses:
        "200":
          description: The status snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}/status/history:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [Status]
      summary: Status transitions
      description: Minimum role Viewer.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Transitions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/StatusTransition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/services/{serviceId}/override:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Status]
      summary: Set a status override
      description: >
        Minimum role Owner. The reason has at least 3 characters. The expiry is in the future and within 30 days.
        One override is active per service. A disabled service cannot be overridden. While an override is active,
        results are still recorded and no new incident or alert is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason, expiresAt]
              properties:
                status: { $ref: "#/components/schemas/ServiceStatus" }
                reason: { type: string, minLength: 3, maxLength: 500 }
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: The status snapshot with the override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Status]
      summary: Cancel the active override
      description: Minimum role Owner. The computed status resumes, and an incident opens at once if the service is down.
      responses:
        "200":
          description: The status snapshot without the override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/incidents:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Incidents]
      summary: List incidents
      description: Minimum role Viewer. Newest first.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [active, resolved] }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Incidents of the project.
          content:
            application/json:
              schema:
                type: object
                required: [incidents]
                properties:
                  incidents:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Incidents]
      summary: Open an incident manually
      description: >
        Minimum role Responder. The incident starts as Investigating and takes the service's public or private
        setting. A service with an active incident returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, title]
              properties:
                serviceId: { type: string, format: uuid }
                title: { type: string, minLength: 3, maxLength: 200 }
      responses:
        "201":
          description: The opened incident.
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects/{projectId}/incidents/{incidentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IncidentId"
    get:
      tags: [Incidents]
      summary: View an incident with its updates
      description: Minimum role Viewer.
      responses:
        "200":
          description: The incident and its updates in time order.
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident: { $ref: "#/components/schemas/IncidentWithUpdates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/incidents/{incidentId}/updates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IncidentId"
    post:
      tags: [Incidents]
      summary: Add an update, optionally moving the incident forward
      description: >
        Minimum role Responder. Status order is Investigating, Identified, Monitoring, Resolved. When `status` is
        present it must be the next status; any other value, including the current one, returns 409. Without
        `status` the update is a note. A resolved incident is closed and refuses further updates. The system never
        resolves an incident. The `isPublic` flag of an update has effect only while the incident is public.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                status: { $ref: "#/components/schemas/IncidentStatus" }
                isPublic: { type: boolean, default: false }
      responses:
        "201":
          description: The incident with all its updates.
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident: { $ref: "#/components/schemas/IncidentWithUpdates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects/{projectId}/incidents/{incidentId}/hide:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IncidentId"
    post:
      tags: [Incidents]
      summary: Hide an incident from the status page
      description: >
        Minimum role Owner. Hiding is one-way: no endpoint makes a hidden incident public again. Repeating the
        request changes nothing and writes no second audit row. The request has no body.
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Number of rows, at most 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Session:
      description: The user and a new token pair.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/TokenPair"
              - type: object
                required: [user]
                properties:
                  user:
                    type: object
                    required: [id, email, name]
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      name: { type: string, nullable: true }
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller is a member with too low a role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist, or the caller is not a member of the project.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: The request is invalid. `details` lists each problem with its path.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION,
                  CONFLICT,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  INTERNAL,
                ]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          { type: integer, description: Access token lifetime in seconds. }

    Role:
      type: string
      enum: [Owner, Responder, Viewer]

    Project:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectWithRole:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            role: { $ref: "#/components/schemas/Role" }

    MemberRef:
      type: object
      required: [userId, email, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }

    Member:
      type: object
      required: [userId, email, name, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }

    ServiceStatus:
      type: string
      enum: [Operational, Degraded, Outage, Unknown]

    ServiceCreate:
      type: object
      required: [name, url, intervalSeconds, timeoutSeconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        url: { type: string, minLength: 1, maxLength: 2048 }
        method: { type: string, enum: [GET, HEAD, POST], default: GET }
        intervalSeconds: { $ref: "#/components/schemas/Interval" }
        timeoutSeconds:
          {
            type: integer,
            minimum: 1,
            description: Must be less than intervalSeconds.,
          }
        expectedStatusCodes:
          type: array
          minItems: 1
          items: { type: integer, minimum: 100, maximum: 599 }
          default: [200]
        expectedBodyText: { type: string, maxLength: 500 }
        isPublic: { type: boolean, default: false }
        credentials:
          {
            type: string,
            maxLength: 2000,
            description: Stored encrypted and never returned.,
          }
        failThreshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        recoveryThreshold:
          { type: integer, minimum: 1, maximum: 20, default: 2 }
        slowThreshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        degradedMs:
          {
            type: integer,
            minimum: 1,
            description: Latency above this value is a slow result. Without it no result is slow.,
          }

    ServicePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        url: { type: string, minLength: 1, maxLength: 2048 }
        method: { type: string, enum: [GET, HEAD, POST] }
        intervalSeconds: { $ref: "#/components/schemas/Interval" }
        timeoutSeconds: { type: integer, minimum: 1 }
        expectedStatusCodes:
          type: array
          minItems: 1
          items: { type: integer, minimum: 100, maximum: 599 }
        expectedBodyText: { type: string, maxLength: 500, nullable: true }
        isPublic: { type: boolean }
        credentials:
          { type: string, minLength: 1, maxLength: 2000, nullable: true }
        failThreshold: { type: integer, minimum: 1, maximum: 20 }
        recoveryThreshold: { type: integer, minimum: 1, maximum: 20 }
        slowThreshold: { type: integer, minimum: 1, maximum: 20 }
        degradedMs: { type: integer, minimum: 1, nullable: true }

    Interval:
      type: integer
      enum: [30, 60, 120, 300, 600, 900, 1800, 3600]

    Service:
      type: object
      required:
        - id
        - projectId
        - name
        - url
        - method
        - intervalSeconds
        - timeoutSeconds
        - expectedStatusCodes
        - expectedBodyText
        - isPublic
        - enabled
        - failThreshold
        - recoveryThreshold
        - slowThreshold
        - degradedMs
        - currentStatus
        - statusSince
        - version
        - createdAt
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        method: { type: string, enum: [GET, HEAD, POST] }
        intervalSeconds: { type: integer }
        timeoutSeconds: { type: integer }
        expectedStatusCodes:
          type: array
          items: { type: integer }
        expectedBodyText: { type: string, nullable: true }
        isPublic: { type: boolean }
        enabled: { type: boolean }
        failThreshold: { type: integer }
        recoveryThreshold: { type: integer }
        slowThreshold: { type: integer }
        degradedMs: { type: integer, nullable: true }
        currentStatus: { $ref: "#/components/schemas/ServiceStatus" }
        statusSince: { type: string, format: date-time }
        version:
          {
            type: integer,
            description: "Configuration version, starting at 1.",
          }
        createdAt: { type: string, format: date-time }

    ServiceEnvelope:
      type: object
      required: [service]
      properties:
        service: { $ref: "#/components/schemas/Service" }

    CheckResult:
      type: object
      required:
        [
          id,
          jobId,
          statusCode,
          latencyMs,
          passed,
          failureReason,
          configVersion,
          checkedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, nullable: true }
        statusCode: { type: integer, nullable: true }
        latencyMs: { type: integer, nullable: true }
        passed: { type: boolean }
        failureReason: { type: string, nullable: true }
        configVersion: { type: integer }
        checkedAt: { type: string, format: date-time }

    StatusSnapshot:
      type: object
      required: [current, computed, since, lastResultAt, override]
      properties:
        current: { $ref: "#/components/schemas/ServiceStatus" }
        computed: { $ref: "#/components/schemas/ServiceStatus" }
        since: { type: string, format: date-time }
        lastResultAt: { type: string, format: date-time, nullable: true }
        override:
          type: object
          nullable: true
          required: [status, reason, createdAt, expiresAt]
          properties:
            status: { $ref: "#/components/schemas/ServiceStatus" }
            reason: { type: string }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }

    StatusEnvelope:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/StatusSnapshot" }

    StatusTransition:
      type: object
      required: [status, computedStatus, source, causedByResultId, startedAt]
      properties:
        status: { $ref: "#/components/schemas/ServiceStatus" }
        computedStatus: { $ref: "#/components/schemas/ServiceStatus" }
        source:
          type: string
          enum: [computed, stale, disabled, override]
          description: What moved the status. `computed` follows check results, `stale` follows three intervals without a result.
        causedByResultId: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time }

    IncidentStatus:
      type: string
      enum: [Investigating, Identified, Monitoring, Resolved]

    Incident:
      type: object
      required:
        - id
        - serviceId
        - serviceName
        - title
        - status
        - origin
        - isPublic
        - openedByUserId
        - resolvedByUserId
        - createdAt
        - updatedAt
        - resolvedAt
      properties:
        id: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        origin: { type: string, enum: [auto, manual] }
        isPublic:
          type: boolean
          description: Derived. True only when the incident is not hidden and its service is public.
        openedByUserId: { type: string, format: uuid, nullable: true }
        resolvedByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    IncidentUpdate:
      type: object
      required: [id, status, message, isPublic, actorUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        message: { type: string }
        isPublic:
          type: boolean
          description: Derived. True only when the update is marked public and its incident is public.
        actorUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    IncidentWithUpdates:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [updates]
          properties:
            updates:
              type: array
              items: { $ref: "#/components/schemas/IncidentUpdate" }
